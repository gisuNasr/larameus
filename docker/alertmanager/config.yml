route:
  repeat_interval: 30m
  receiver: "sms-notifications"
  routes:
    - receiver: "email-notifications"
      group_wait: 30s
      match_re:
        severity: critical|warning
      continue: true

    - receiver: "sms-notifications"
      group_wait: 30s
      match_re:
        severity: critical
      continue: true

receivers:
  - name: "email-notifications"
    email_configs:
      - to: gisu@gmail.com
        from: yourmail@gmail.com
        smarthost: smtp.gmail.com:587
        auth_username: yourmail@gmail.com
        auth_identity: yourmail@gmail.com
        auth_password: xxxxxxxxxxxxxxxxxx
        # create your own auth_password => https://support.google.com/mail/answer/185833?hl=en
        send_resolved: true

  - name: "sms-notifications"
    webhook_configs:
      # Placeholder — this app doesn't expose a notify endpoint. Point this
      # at a real webhook receiver (Slack incoming webhook, PagerDuty Events
      # API, Opsgenie, ntfy.sh, etc.) to actually receive critical alerts.
      - url: http://example.invalid/notify/send
        send_resolved: true
